name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
    inputs:
      upload-release-bundle:
        description: Package APKs for the calling release workflow
        required: false
        type: boolean
        default: false
    secrets:
      POMODOROUGH_RELEASE_KEYSTORE_BASE64:
        required: false
      POMODOROUGH_RELEASE_STORE_PASSWORD:
        required: false
      POMODOROUGH_RELEASE_KEY_ALIAS:
        required: false
      POMODOROUGH_RELEASE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  TZ: Etc/UTC

jobs:
  verify:
    name: Unit tests, lint, and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests, lint, and assemble test APKs
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleDebugAndroidTest

      - name: Assemble unsigned release APK
        if: ${{ !inputs.upload-release-bundle }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Build, verify, and package signed release artifacts
        if: inputs.upload-release-bundle
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.POMODOROUGH_RELEASE_KEYSTORE_BASE64 }}
          POMODOROUGH_RELEASE_STORE_FILE: ${{ runner.temp }}/pomodorough-release.jks
          POMODOROUGH_RELEASE_STORE_PASSWORD: ${{ secrets.POMODOROUGH_RELEASE_STORE_PASSWORD }}
          POMODOROUGH_RELEASE_KEY_ALIAS: ${{ secrets.POMODOROUGH_RELEASE_KEY_ALIAS }}
          POMODOROUGH_RELEASE_KEY_PASSWORD: ${{ secrets.POMODOROUGH_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$POMODOROUGH_RELEASE_STORE_PASSWORD"
          test -n "$POMODOROUGH_RELEASE_KEY_ALIAS"
          test -n "$POMODOROUGH_RELEASE_KEY_PASSWORD"
          umask 077
          trap 'rm -f "$POMODOROUGH_RELEASE_STORE_FILE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$POMODOROUGH_RELEASE_STORE_FILE"
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease
          release_apk="app/build/outputs/apk/release/app-release.apk"
          release_aab="app/build/outputs/bundle/release/app-release.aab"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner" \
            verify --verbose --print-certs "$release_apk"
          jarsigner -verify -verbose -certs "$release_aab" \
            > "$RUNNER_TEMP/aab-verification.txt" 2>&1
          grep -Fq "jar verified." "$RUNNER_TEMP/aab-verification.txt"
          mkdir -p dist
          cp "$release_apk" "dist/pomodorough-${GITHUB_REF_NAME}-release.apk"
          cp "$release_aab" "dist/pomodorough-${GITHUB_REF_NAME}-release.aab"
          cd dist
          sha256sum -- *.apk *.aab > SHA256SUMS.txt

      - name: Upload release bundle
        if: inputs.upload-release-bundle
        uses: actions/upload-artifact@v4
        with:
          name: pomodorough-android-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
