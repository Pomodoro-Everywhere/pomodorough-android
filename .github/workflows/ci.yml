name: CI
run-name: candidate-${{ inputs.candidate-request || github.run_id }}

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      candidate-request:
        description: Unique hosted candidate execution request
        required: true
        type: string
      expected-sha:
        description: Exact candidate source commit; fail if dispatch branch moved
        required: true
        type: string
      command-sha256:
        description: SHA256 of the invoking candidate adapter argument array
        required: true
        type: string
      upload-release-bundle:
        description: Exercise release packaging and ABI smoke tests without publishing
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      upload-release-bundle:
        description: Package APKs for the calling release workflow
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.candidate-request || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  # Runner image policy: jobs pin runs-on ubuntu-24.04, whose hosted image
  # updates in place. ANDROID_CACHE_REVISION is the manual image-revision
  # component of SDK/emulator cache keys; bump it when GitHub refreshes the
  # ubuntu-24.04 image so stale SDK/system-image bytes cannot be reused.
  ANDROID_CACHE_REVISION: "1"
  CORE_COMMIT: "b25e0d8ef76a564e1201a02b78afe88d5710a30e"
  CORE_SHA256: "150d5aa6f1eef08e89bfd33e863897938ae5df6fc9f38a730796e41ba48ed6fa"
  TZ: Etc/UTC

jobs:
  candidate-source:
    name: Validate candidate source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check candidate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          inputs = json.loads(os.environ["CANDIDATE_INPUTS"])
          assert re.fullmatch(r"[0-9a-f]{32}", inputs["candidate-request"])
          assert re.fullmatch(r"[0-9a-f]{40}", inputs["expected-sha"])
          assert re.fullmatch(r"[0-9a-f]{64}", inputs["command-sha256"])
          assert inputs["expected-sha"] == os.environ["GITHUB_SHA"]
          assert os.environ["GITHUB_RUN_ATTEMPT"] == "1"
          assert os.environ["RUNNER_ENVIRONMENT"] == "github-hosted"
          context = {
              "inputs": inputs,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runner_environment": os.environ["RUNNER_ENVIRONMENT"],
          }
          with open("candidate-context.json", "w") as output:
              json.dump(context, output, sort_keys=True)
          PY

      - name: Retain candidate dispatch context
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-context-${{ inputs.candidate-request }}
          path: candidate-context.json
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: candidate-source
    name: Unit tests, lint, and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify checked out source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Check documentation links
        run: |
          python3 scripts/check_docs.py
          python3 scripts/check_protocol_fixture.py
          python3 scripts/check_workflow_pins.py
          python3 -m unittest scripts/test_check_localization.py scripts/test_ci_workflow.py scripts/test_ci_source_checks.py scripts/test_release_runtime_abi.py scripts/test_emulator_startup_configuration.py scripts/test_android_emulator_lifecycle.py -v
          python3 scripts/check_localization.py

      # These fixtures test source, not a device or matrix configuration.
      # Run once here; publication requires verify plus every connected cell.
      - name: Check Android readiness adapter
        run: |
          python3 -m unittest scripts/test_android_readiness.py -v
          python3 -m unittest discover -s scripts -p test_android_startup_phase.py -v

      - name: Check Android startup diagnostics
        run: python3 -m unittest scripts/test_android_startup_diagnostics.py scripts/test_android_diagnostic_capture.py -v

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Check out pinned shared core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Pomodoro-Everywhere/pomodorough-core
          ref: ${{ env.CORE_COMMIT }}
          path: pomodorough-core-source
          persist-credentials: false

      - name: Cache Rust toolchain and cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu
          key: rust-toolchain-1.97.1-${{ runner.os }}-${{ env.CORE_COMMIT }}
          restore-keys: |
            rust-toolchain-1.97.1-${{ runner.os }}-

      # Shared core build output is only valid for the exact pinned core
      # commit; no restore-keys fallback so a stale target/ can never be
      # reused across CORE_COMMIT bumps.
      - name: Cache shared core build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            pomodorough-core-source/target
          key: rust-core-target-1.97.1-${{ runner.os }}-${{ env.CORE_COMMIT }}

      - name: Rebuild and verify pinned shared core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pomodorough-core-source rev-parse HEAD)" = "$CORE_COMMIT"
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
          (
            cd pomodorough-core-source
            cargo +1.97.1 build --release --target wasm32-unknown-unknown --locked
          )
          rebuilt=pomodorough-core-source/target/wasm32-unknown-unknown/release/pomodorough_core.wasm
          python3 pomodorough-core-source/scripts/canonicalize_wasm_artifact.py \
            "$rebuilt"
          python3 pomodorough-core-source/scripts/verify_wasm_artifact.py \
            "$rebuilt"
          python3 pomodorough-core-source/scripts/verify_wasm_artifact.py \
            app/src/main/assets/pomodorough_core.wasm \
            --sha256 "$CORE_SHA256"
          python3 scripts/verify_shared_core_provenance.py \
            --sha256 "$CORE_SHA256" \
            "$rebuilt" \
            app/src/main/assets/pomodorough_core.wasm
          grep -Fx "CORE_COMMIT=$CORE_COMMIT" app/src/main/assets/shared_core.properties
          grep -Fx "CORE_SHA256=$CORE_SHA256" app/src/main/assets/shared_core.properties

      # SDK cache is performance-only: the install step below always runs
      # sdkmanager after restore, and verification fails closed on a corrupt
      # or partial cache instead of feeding the release build.
      - name: Cache Android SDK packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-${{ env.ANDROID_API_LEVEL }}
            /usr/local/lib/android/sdk/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          key: android-sdk-verify-${{ runner.os }}-img${{ env.ANDROID_CACHE_REVISION }}-api${{ env.ANDROID_API_LEVEL }}-tools${{ env.ANDROID_BUILD_TOOLS_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Verify Android SDK packages after cache restore
        run: |
          sdkmanager --list_installed | grep -F "platforms;android-${ANDROID_API_LEVEL}"
          sdkmanager --list_installed | grep -F "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run unit tests and lint
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:lintRelease

      - name: Assemble debug and test APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Assemble unsigned release APK
        if: ${{ !inputs.upload-release-bundle }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify shared core in unsigned release APK
        if: ${{ !inputs.upload-release-bundle }}
        shell: bash
        run: |
          set -euo pipefail
          release_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          packaged_core_sha=$(unzip -p "$release_apk" assets/pomodorough_core.wasm | sha256sum | awk '{print $1}')
          test "$packaged_core_sha" = "$CORE_SHA256"

      - name: Build, verify, and package unsigned release artifacts
        if: inputs.upload-release-bundle
        env:
          POMODOROUGH_SENTRY_DSN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SENTRY_DSN || '' }}
        run: |
          set -euo pipefail
          source_date_epoch="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH="$source_date_epoch"
          first_apk="$RUNNER_TEMP/pomodorough-release-first.apk"
          first_aab="$RUNNER_TEMP/pomodorough-release-first.aab"
          rm -rf app/build
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease
          python3 scripts/normalize_release_aab.py app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$first_apk"
          cp app/build/outputs/bundle/release/app-release.aab "$first_aab"
          rm -rf app/build
          ./gradlew --no-daemon --stacktrace -Ppomodorough.testBuildType=release \
            :app:assembleRelease :app:bundleRelease :app:assembleReleaseAndroidTest
          python3 scripts/normalize_release_aab.py app/build/outputs/bundle/release/app-release.aab
          cmp "$first_apk" app/build/outputs/apk/release/app-release-unsigned.apk
          cmp "$first_aab" app/build/outputs/bundle/release/app-release.aab
          release_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          release_aab="app/build/outputs/bundle/release/app-release.aab"
          release_test_apk="app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
          test -f "$release_apk"
          test -f "$release_aab"
          test -f "$release_test_apk"
          target_classes="$RUNNER_TEMP/release-target-classes.txt"
          test_classes="$RUNNER_TEMP/release-test-classes.txt"
          apkanalyzer dex packages --defined-only "$release_apk" > "$target_classes"
          apkanalyzer dex packages --defined-only "$release_test_apk" > "$test_classes"
          for source_class in \
            me.egigoka.pomodorough.data.iroh.IrohReplicationService \
            me.egigoka.pomodorough.data.iroh.IrohEndpointLifecycle \
            computer.iroh.EndpointBuilder \
            computer.iroh.Endpoint \
            computer.iroh.EndpointAddr \
            computer.iroh.Incoming \
            computer.iroh.Accepting \
            computer.iroh.Connection; do
            mapping_line="$(grep -F "$source_class -> " app/build/outputs/mapping/release/mapping.txt)"
            test -n "$mapping_line"
            obfuscated_class="${mapping_line#* -> }"
            obfuscated_class="${obfuscated_class%:}"
            test "$obfuscated_class" != "$source_class"
            grep -E "^C[[:space:]].*[[:space:]]${obfuscated_class}$" "$target_classes"
            if grep -E "^C[[:space:]].*[[:space:]]${obfuscated_class}$" "$test_classes"; then
              echo "Release test APK defines production class $obfuscated_class" >&2
              exit 1
            fi
          done
          packaged_core_sha=$(unzip -p "$release_apk" assets/pomodorough_core.wasm | sha256sum | awk '{print $1}')
          test "$packaged_core_sha" = "$CORE_SHA256"
          packaged_core_sha=$(unzip -p "$release_aab" base/assets/pomodorough_core.wasm | sha256sum | awk '{print $1}')
          test "$packaged_core_sha" = "$CORE_SHA256"
          if "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner" verify "$release_apk" >/dev/null 2>&1; then
            echo "Release APK unexpectedly contains a production signature" >&2
            exit 1
          fi
          jarsigner -verify -verbose -certs "$release_aab" > "$RUNNER_TEMP/aab-verification.txt" 2>&1
          if ! grep -Fq 'jar is unsigned.' "$RUNNER_TEMP/aab-verification.txt"; then
            echo "Release AAB unexpectedly contains a production signature" >&2
            exit 1
          fi
          mkdir -p dist release-test
          cp "$release_apk" "dist/pomodorough-${GITHUB_REF_NAME}-release-unsigned.apk"
          cp "$release_aab" "dist/pomodorough-${GITHUB_REF_NAME}-release-unsigned.aab"
          cp "$release_test_apk" "release-test/pomodorough-${GITHUB_REF_NAME}-release-androidTest.apk"
          cd dist
          sha256sum -- *.apk *.aab > SHA256SUMS.txt

      - name: Upload release bundle
        if: inputs.upload-release-bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pomodorough-android-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload release instrumentation payload
        if: inputs.upload-release-bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pomodorough-android-release-test-${{ github.ref_name }}
          path: release-test/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  connected:
    needs: candidate-source
    name: Connected API ${{ matrix.api-level }} · ${{ matrix.font-scale }}x font · ${{ matrix.locale }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STARTUP_DIAGNOSTICS: app/build/reports/androidTests/startup-api-${{ matrix.api-level }}-font-${{ matrix.font-scale }}-locale-${{ matrix.locale }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 35
            font-scale: "1.0"
            locale: "en-US"
            test-class: ""
          - api-level: 35
            font-scale: "2.0"
            locale: "en-US"
            test-class: ""
          - api-level: 36
            font-scale: "1.0"
            locale: "en-US"
            test-class: ""
          - api-level: 36
            font-scale: "2.0"
            locale: "en-US"
            test-class: ""
          - api-level: 35
            font-scale: "1.0"
            locale: "ar-XB"
            test-class: me.egigoka.pomodorough.ui.PomodoroughRtlAccessibilityTest
          - api-level: 35
            font-scale: "2.0"
            locale: "ar-XB"
            test-class: me.egigoka.pomodorough.ui.PomodoroughRtlAccessibilityTest
          - api-level: 36
            font-scale: "1.0"
            locale: "ar-XB"
            test-class: me.egigoka.pomodorough.ui.PomodoroughRtlAccessibilityTest
          - api-level: 36
            font-scale: "2.0"
            locale: "ar-XB"
            test-class: me.egigoka.pomodorough.ui.PomodoroughRtlAccessibilityTest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify checked out source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Assemble connected test APKs before emulator boot
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      # Emulator cache is performance-only: run-android-emulator.py setup()
      # always reinstalls platform, emulator, image, and build-tools after
      # restore, so a corrupt cache fails closed instead of booting stale.
      - name: Cache emulator SDK and system image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-${{ matrix.api-level }}
            /usr/local/lib/android/sdk/system-images/android-${{ matrix.api-level }}
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/build-tools/37.0.0
          key: android-emulator-${{ runner.os }}-img${{ env.ANDROID_CACHE_REVISION }}-api${{ matrix.api-level }}-x86_64-build37.0.0
          restore-keys: |
            android-emulator-${{ runner.os }}-img${{ env.ANDROID_CACHE_REVISION }}-api${{ matrix.api-level }}-

      - name: Set up emulator SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '14742923'
          packages: platform-tools

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        run: |
          python3 .github/scripts/run-android-emulator.py \
            --api-level ${{ matrix.api-level }} --architecture x86_64 \
            --output app/build/reports/androidTests/emulator-api-${{ matrix.api-level }}-font-${{ matrix.font-scale }}-locale-${{ matrix.locale }} \
            --startup-diagnostics "$STARTUP_DIAGNOSTICS" \
            -- env FONT_SCALE=${{ matrix.font-scale }} TEST_LOCALE=${{ matrix.locale }} TEST_CLASS=${{ matrix.test-class }} .github/scripts/run-instrumented-tests.sh

      - name: Finish Android startup diagnostics
        if: always()
        timeout-minutes: 1
        run: python3 .github/scripts/android-startup-diagnostics.py stop --output "$STARTUP_DIAGNOSTICS"

      - name: Retain connected reports, screenshots, and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connected-api-${{ matrix.api-level }}-font-${{ matrix.font-scale }}-locale-${{ matrix.locale }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 14

  release-smoke:
    name: Clean-install packaged release payload (API ${{ matrix.api-level }}, ${{ matrix.runtime-abi }})
    if: inputs.upload-release-bundle
    # Release smoke overlaps debug connected tests: it only needs verify's
    # bundle, and final publishing stays gated on the full ci result.
    # Accepted cost: a commit whose connected tests fail still burns
    # release-smoke emulator minutes. Kept intentionally so release packaging
    # feedback never waits on the 8-cell connected matrix; do not add
    # connected to needs without a release-latency justification.
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 30
            architecture: x86
            runtime-abi: x86
          - api-level: 36
            architecture: x86_64
            runtime-abi: x86_64
          # Android 11 Google APIs images execute ARM libraries through their native bridge.
          # https://android-developers.googleblog.com/2020/03/run-arm-apps-on-android-emulator.html
          - api-level: 30
            architecture: x86
            runtime-abi: armeabi-v7a
          - api-level: 30
            architecture: x86_64
            runtime-abi: arm64-v8a
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify checked out source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download unsigned release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pomodorough-android-${{ github.ref_name }}
          path: dist

      - name: Download release instrumentation payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pomodorough-android-release-test-${{ github.ref_name }}
          path: release-test

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Same performance-only contract as connected: the emulator runner
      # reinstalls SDK packages after restore before booting the guest.
      - name: Cache emulator SDK and system image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-${{ matrix.api-level }}
            /usr/local/lib/android/sdk/system-images/android-${{ matrix.api-level }}
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/build-tools/37.0.0
            /usr/local/lib/android/sdk/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          key: android-smoke-${{ runner.os }}-img${{ env.ANDROID_CACHE_REVISION }}-api${{ matrix.api-level }}-${{ matrix.architecture }}-build37.0.0-tools${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          restore-keys: |
            android-smoke-${{ runner.os }}-img${{ env.ANDROID_CACHE_REVISION }}-api${{ matrix.api-level }}-
            android-emulator-${{ runner.os }}-img${{ env.ANDROID_CACHE_REVISION }}-api${{ matrix.api-level }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '14742923'
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ephemerally sign, clean-install, and launch packaged APK
        run: |
          python3 .github/scripts/run-android-emulator.py \
            --api-level ${{ matrix.api-level }} --architecture ${{ matrix.architecture }} \
            --output release-emulator-results \
            -- env RUNTIME_ABI=${{ matrix.runtime-abi }} bash .github/scripts/smoke-packaged-release.sh

      - name: Retain release-Iroh instrumentation and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-smoke-api-${{ matrix.api-level }}-${{ matrix.runtime-abi }}
          path: |
            release-smoke-results/
            release-emulator-results/
          if-no-files-found: error
          retention-days: 14

