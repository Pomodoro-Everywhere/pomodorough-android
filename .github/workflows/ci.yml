name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
    inputs:
      upload-release-bundle:
        description: Package APKs for the calling release workflow
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  TZ: Etc/UTC

jobs:
  verify:
    name: Unit tests, lint, and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check documentation links
        run: |
          python3 scripts/check_docs.py
          python3 scripts/check_protocol_fixture.py
          python3 scripts/check_workflow_pins.py
          python3 -m unittest scripts/test_check_localization.py -v
          python3 scripts/check_localization.py

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run unit tests, lint, and assemble test APKs
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleDebugAndroidTest

      - name: Assemble unsigned release APK
        if: ${{ !inputs.upload-release-bundle }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Build, verify, and package unsigned release artifacts
        if: inputs.upload-release-bundle
        run: |
          set -euo pipefail
          source_date_epoch="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH="$source_date_epoch"
          first_apk="$RUNNER_TEMP/pomodorough-release-first.apk"
          first_aab="$RUNNER_TEMP/pomodorough-release-first.aab"
          rm -rf app/build
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease
          python3 scripts/normalize_release_aab.py app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$first_apk"
          cp app/build/outputs/bundle/release/app-release.aab "$first_aab"
          rm -rf app/build
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease
          python3 scripts/normalize_release_aab.py app/build/outputs/bundle/release/app-release.aab
          cmp "$first_apk" app/build/outputs/apk/release/app-release-unsigned.apk
          cmp "$first_aab" app/build/outputs/bundle/release/app-release.aab
          release_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          release_aab="app/build/outputs/bundle/release/app-release.aab"
          test -f "$release_apk"
          test -f "$release_aab"
          if "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner" verify "$release_apk" >/dev/null 2>&1; then
            echo "Release APK unexpectedly contains a production signature" >&2
            exit 1
          fi
          jarsigner -verify -verbose -certs "$release_aab" > "$RUNNER_TEMP/aab-verification.txt" 2>&1
          if ! grep -Fq 'jar is unsigned.' "$RUNNER_TEMP/aab-verification.txt"; then
            echo "Release AAB unexpectedly contains a production signature" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$release_apk" "dist/pomodorough-${GITHUB_REF_NAME}-release-unsigned.apk"
          cp "$release_aab" "dist/pomodorough-${GITHUB_REF_NAME}-release-unsigned.aab"
          cd dist
          sha256sum -- *.apk *.aab > SHA256SUMS.txt

      - name: Upload release bundle
        if: inputs.upload-release-bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pomodorough-android-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  connected:
    name: Connected API ${{ matrix.api-level }} · ${{ matrix.font-scale }}x font
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
        font-scale: ["1.0", "2.0"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check documentation links
        run: |
          python3 scripts/check_docs.py
          python3 scripts/check_protocol_fixture.py
          python3 scripts/check_workflow_pins.py
          python3 -m unittest scripts/test_check_localization.py -v
          python3 scripts/check_localization.py

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
            FONT_SCALE=${{ matrix.font-scale }} .github/scripts/run-instrumented-tests.sh

      - name: Retain connected reports, screenshots, and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connected-api-${{ matrix.api-level }}-font-${{ matrix.font-scale }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14

  release-smoke:
    name: Clean-install packaged release payload (API 36)
    if: inputs.upload-release-bundle
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download unsigned release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pomodorough-android-${{ github.ref_name }}
          path: dist

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ephemerally sign, clean-install, and launch packaged APK
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            shopt -s nullglob
            release_apks=(dist/*-release-unsigned.apk)
            if (( ${#release_apks[@]} != 1 )); then
              echo "Expected exactly one unsigned release APK" >&2
              exit 1
            fi
            unsigned_apk="${release_apks[0]}"
            smoke_apk="$RUNNER_TEMP/pomodorough-release-smoke.apk"
            smoke_keystore="$RUNNER_TEMP/pomodorough-release-smoke.jks"
            cp "$unsigned_apk" "$smoke_apk"
            keytool -genkeypair -noprompt -keystore "$smoke_keystore" -storepass smoke-only \
              -keypass smoke-only -alias smoke -keyalg RSA -keysize 2048 -validity 1 \
              -dname 'CN=Ephemeral CI release smoke'
            "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner" sign \
              --ks "$smoke_keystore" --ks-pass pass:smoke-only \
              --key-pass pass:smoke-only "$smoke_apk"
            adb uninstall me.egigoka.pomodorough >/dev/null 2>&1 || true
            adb install "$smoke_apk"
            launch_output="$(adb shell am start -W -n me.egigoka.pomodorough/.MainActivity)"
            printf '%s\n' "$launch_output"
            grep -Fq 'Status: ok' <<< "$launch_output"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
