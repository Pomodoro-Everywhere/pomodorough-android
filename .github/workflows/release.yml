name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  TZ: Etc/UTC

jobs:
  validate-release:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate tag, version name, and version code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_NAME}" != v* ]] || [[ ! "${tag_version}" =~ ${semver_pattern} ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi

          version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts)"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts)"
          if [[ "${version_name}" != "${tag_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${version_name}" >&2
            exit 1
          fi
          if [[ ! "${version_code}" =~ ^[1-9][0-9]*$ ]]; then
            echo "versionCode must be a positive integer" >&2
            exit 1
          fi

          release_state="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || printf missing)"
          if [[ "$release_state" != "published" ]]; then
            previous_tags=()
            while IFS= read -r candidate; do
              if [[ "${candidate}" == "${GITHUB_REF_NAME}" ]]; then
                continue
              fi
              candidate_version="${candidate#v}"
              if [[ ! "${candidate_version}" =~ ${semver_pattern} ]]; then
                echo "Existing release tag ${candidate} is not strict SemVer" >&2
                exit 1
              fi
              previous_tags+=("${candidate}")
            done < <(git tag --list 'v*')

            if (( ${#previous_tags[@]} > 0 )); then
              highest_previous_version="$(
                printf '%s\n' "${previous_tags[@]#v}" | sort -V | tail -n 1
              )"
              highest_version="$(
                printf '%s\n' "${highest_previous_version}" "${tag_version}" | sort -V | tail -n 1
              )"
              if [[ "${highest_version}" != "${tag_version}" ]] ||
                [[ "${highest_previous_version}" == "${tag_version}" ]]; then
                echo "Release ${tag_version} must exceed existing ${highest_previous_version}" >&2
                exit 1
              fi

              maximum_previous_code=0
              maximum_previous_tag=""
              for previous_tag in "${previous_tags[@]}"; do
                previous_build="$(git show "${previous_tag}:app/build.gradle.kts")"
                previous_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' <<< "${previous_build}")"
                if [[ ! "${previous_code}" =~ ^[1-9][0-9]*$ ]]; then
                  echo "${previous_tag} has invalid versionCode" >&2
                  exit 1
                fi
                if (( 10#${previous_code} > maximum_previous_code )); then
                  maximum_previous_code=$((10#${previous_code}))
                  maximum_previous_tag="${previous_tag}"
                fi
              done
              if (( 10#${version_code} <= maximum_previous_code )); then
                echo "versionCode ${version_code} must exceed ${maximum_previous_code} from ${maximum_previous_tag}" >&2
                exit 1
              fi
            fi
          fi

  ci:
    name: Verify release
    needs: validate-release
    uses: ./.github/workflows/ci.yml
    with:
      upload-release-bundle: true
    permissions:
      contents: read

  release:
    name: Create GitHub release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository for SBOM
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pomodorough-android-${{ github.ref_name }}
          path: dist

      - name: Export SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/pomodorough-android.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Refresh checksums with SBOM
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- *.apk *.aab *.spdx.json > SHA256SUMS.txt)

      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.apk
            dist/*.aab
            dist/*.spdx.json
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_assets=(
            "pomodorough-${GITHUB_REF_NAME}-release-unsigned.apk"
            "pomodorough-${GITHUB_REF_NAME}-release-unsigned.aab"
            "pomodorough-android.spdx.json"
          )
          expected_release_assets=("${expected_assets[@]}" "SHA256SUMS.txt")

          verify_release_assets() {
            published_dir="$(mktemp -d "$RUNNER_TEMP/published-release.XXXXXX")"
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$published_dir"
            printf '%s\n' "${expected_release_assets[@]}" | sort > "$RUNNER_TEMP/expected-assets.txt"
            find "$published_dir" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | sort > "$RUNNER_TEMP/actual-assets.txt"
            cmp "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
            (
              cd "$published_dir"
              sha256sum --check SHA256SUMS.txt
              printf '%s\n' "${expected_assets[@]}" | sort > expected-manifest-assets.txt
              awk '{print $2}' SHA256SUMS.txt | sed 's|^\*||' | sort > actual-manifest-assets.txt
              cmp expected-manifest-assets.txt actual-manifest-assets.txt
              for asset in "${expected_assets[@]}"; do
                gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
              done
              gh attestation verify SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
            )
          }

          release_state="missing"
          if release_state="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null)"; then
            if [[ "$release_state" == "published" ]]; then
              verify_release_assets
              echo "Release $GITHUB_REF_NAME is already published"
              exit 0
            fi
          else
            release_state="missing"
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            printf '%s\n' \
              'Signing is intentionally excluded from this release. Verify SHA256SUMS.txt and GitHub attestations.' \
              '' \
              "- pomodorough-${GITHUB_REF_NAME}-release-unsigned.aab requires an authorized Play upload signature before distribution." \
              "- pomodorough-${GITHUB_REF_NAME}-release-unsigned.apk requires an authorized installer signature before installation." \
              '- CI clean-installs the exact APK payload only after applying a one-use ephemeral smoke-test signature; that signed copy is never published.' \
              ''
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" \
              --jq .body
          } > "$notes_file"

          if [[ "$release_state" == "missing" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Pomodorough Android $GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          fi
          while IFS= read -r asset; do
            gh release delete-asset "$GITHUB_REF_NAME" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          done < <(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')
          gh release upload "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY"
          verify_release_assets
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pomodorough Android $GITHUB_REF_NAME" \
            --notes-file "$notes_file" \
            --draft=false
